[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "lumascan-local"
version = "0.1.0"
description = "Local-first family photo and document digitisation with verified capture receipts"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "numpy>=2,<3", "opencv-python>=4.10,<5", "Pillow>=11,<13", "pillow-heif>=0.22,<2", "reportlab>=4.4,<5", "qrcode>=8,<9", "cryptography>=44,<49", "onnxruntime>=1.20,<2"]
[project.optional-dependencies]
ocr = ["rapidocr==3.9.2"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[project.scripts]
lumascan = "lumascan.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/lumascan"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
