<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LumaScan · Kamera</title><link rel="stylesheet" href="/phone.css"><script type="module" src="/phone.js"></script></head><body>
<header><strong>LumaScan</strong><select id="language" aria-label="Language"><option value="de">DE</option><option value="en">EN</option></select></header>
<main><p id="collection"></p><div class="camera"><video id="video" playsinline muted></video><canvas id="overlay"></canvas><div id="feedback" role="status" aria-live="polite"><span id="icon">○</span><strong id="message">Verbinden …</strong><progress id="progress" max="1" value="0"></progress></div></div>
<p><strong id="count">0</strong> <span data-i="saved">gesichert</span></p><div class="controls"><button id="start" data-i="start">Kamera starten</button><button id="manual" data-i="manual" disabled>Jetzt scannen</button><label><input id="auto" type="checkbox" checked><span data-i="auto">Automatik</span></label><button id="torch" disabled data-i="torch">Licht</button></div>
<p id="quality"></p><button id="review" hidden data-i="review">Aufnahme trotzdem bestätigen</button><p id="error" role="alert"></p><p class="hint" data-i="hint">Vorlage flach auflegen, Kamera ruhig halten. Erst nach dem grünen Haken austauschen. Unterlage optional.</p></main></body></html>
